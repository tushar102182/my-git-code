    <style>
        .container{

            border:2px solid tomato;
            height:30px;

        }
        .box-container{
            display:flex;
            gap: 30px;
        }
        .box{
            font-size: 1.25em;

            height: 30px;
            width: 40px;
        }
        .user-container{

            justify-content: space-between;

        }
        .user{
            border :2px solid skyblue;
            height: 40px;
            width: 50px;
            font-size: 1.25em;
        }
        .card-container{
            display:flex;
            gap:20px;
            flex-wrap:wrap;


        }
        .card{
            border :2px solid skyblue;
            height: 70px;
            width: 150px;
            font-size: 1.25em;
        }

    </style>
